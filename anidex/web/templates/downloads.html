{% extends "base.html" %}
{% block title %}Downloads — AniDex{% endblock %}
{% block content %}
<div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;align-items:flex-end">
  <div>
    <div class="section" style="margin:0">Downloads</div>
    <div class="muted" id="sub-lbl">Local episode files</div>
  </div>
  <div style="flex:1"></div>
  <label class="dl-select-all">
    <input type="checkbox" id="chk-select-all" />
    Select all
  </label>
  <button class="btn danger" id="btn-delete-sel" type="button" disabled>Delete selected</button>
  <button class="btn" id="btn-refresh" type="button">Refresh</button>
</div>
<p class="status" id="status">Loading…</p>

<section id="active-section" class="dl-active-section" hidden>
  <div class="section">Downloading now</div>
  <div id="active-list" class="dl-list"></div>
</section>

<div id="list" class="dl-list"></div>
<p class="muted" id="empty" style="display:none;padding:24px">No downloads yet — grab episodes from Watch on AnimePahe.</p>
{% endblock %}
{% block scripts %}
<script>
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
  return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
}
function fmtEp(ep) {
  if (ep == null || ep === "") return "";
  return Number.isInteger(ep) ? `Ep ${ep}` : `Ep ${ep}`;
}

let pollTimer = null;
let lastActiveIds = "";
let knownItems = [];

function selectedIds() {
  return $all("#list .dl-check:checked").map((el) => Number(el.value));
}

function updateSelectUi() {
  const boxes = $all("#list .dl-check");
  const checked = boxes.filter((b) => b.checked);
  const all = $("#chk-select-all");
  all.disabled = !boxes.length;
  all.checked = boxes.length > 0 && checked.length === boxes.length;
  all.indeterminate = checked.length > 0 && checked.length < boxes.length;
  $("#btn-delete-sel").disabled = checked.length === 0;
  $("#btn-delete-sel").textContent =
    checked.length > 1 ? `Delete selected (${checked.length})` : "Delete selected";
}

function renderActive(jobs) {
  const section = $("#active-section");
  const list = $("#active-list");
  const ids = (jobs || []).map((j) => j.id).join(",");
  if (!jobs || !jobs.length) {
    section.hidden = true;
    list.innerHTML = "";
    lastActiveIds = "";
    return;
  }
  section.hidden = false;

  // Rebuild DOM when set of jobs changes; otherwise update bars in place
  if (ids !== lastActiveIds) {
    lastActiveIds = ids;
    list.innerHTML = "";
    jobs.forEach((j) => {
      const meta = j.meta || {};
      const title = meta.title || "Anime";
      const ep = fmtEp(meta.episode);
      const pct = j.total ? Math.round((j.progress / j.total) * 100) : 0;
      const row = document.createElement("div");
      row.className = "dl-row dl-active";
      row.dataset.jobId = j.id;
      row.innerHTML = `
        <img class="dl-cover" src="${esc(meta.cover_url || "")}" alt="" onerror="this.style.opacity=.2" />
        <div class="dl-main">
          <div class="title">${esc(title)}${ep ? ` · ${esc(ep)}` : ""}</div>
          <div class="sub dl-job-msg">${esc(j.message || j.status || "Starting…")}</div>
          <div class="dl-progress">
            <div class="dl-progress-bar"><i style="width:${pct}%"></i></div>
            <span class="dl-progress-txt">${j.total ? `${j.progress}/${j.total} · ${pct}%` : "…"}</span>
          </div>
        </div>`;
      list.appendChild(row);
    });
    return;
  }

  jobs.forEach((j) => {
    const row = list.querySelector(`[data-job-id="${j.id}"]`);
    if (!row) return;
    const pct = j.total ? Math.round((j.progress / j.total) * 100) : 0;
    const msg = row.querySelector(".dl-job-msg");
    const bar = row.querySelector(".dl-progress-bar i");
    const txt = row.querySelector(".dl-progress-txt");
    if (msg) msg.textContent = j.message || j.status || "Starting…";
    if (bar) bar.style.width = pct + "%";
    if (txt) txt.textContent = j.total ? `${j.progress}/${j.total} · ${pct}%` : "…";
  });
}

function renderItems(items) {
  const list = $("#list");
  const prev = new Set(selectedIds());
  list.innerHTML = "";
  knownItems = items || [];
  $("#empty").style.display = knownItems.length ? "none" : "block";

  knownItems.forEach((it) => {
    const row = document.createElement("div");
    row.className = "dl-row";
    const ep = fmtEp(it.episode);
    const label = it.label || it.filename || "";
    row.innerHTML = `
      <label class="dl-check-wrap" title="Select">
        <input type="checkbox" class="dl-check" value="${it.id}" ${prev.has(it.id) ? "checked" : ""} />
      </label>
      <img class="dl-cover" src="${esc(it.cover_url || "")}" alt="" onerror="this.style.opacity=.2" />
      <div class="dl-main">
        <div class="title">${esc(it.title)}</div>
        <div class="sub">${esc([ep, label, fmtBytes(it.bytes), it.created_at].filter(Boolean).join(" · "))}</div>
      </div>
      <div class="dl-actions row">
        <a class="btn primary" href="${it.user_anime_id ? `/watch/${it.user_anime_id}` : "#"}">Watch</a>
        <a class="btn" href="/api/media/${it.id}/file" target="_blank" rel="noopener">Open file</a>
        <button class="btn danger" type="button" data-del="${it.id}">Delete</button>
      </div>`;
    const del = row.querySelector("[data-del]");
    del.onclick = async () => {
      if (!confirm(`Delete download for ${it.title}${ep ? " · " + ep : ""}?`)) return;
      try {
        await api(`/api/media/${it.id}`, { method: "DELETE" });
        await load({ quiet: true });
      } catch (e) {
        $("#status").textContent = e.message;
      }
    };
    if (!it.user_anime_id) {
      const w = row.querySelector("a.primary");
      w.removeAttribute("href");
      w.classList.add("disabled");
      w.onclick = (e) => e.preventDefault();
    }
    row.querySelector(".dl-check").onchange = updateSelectUi;
    list.appendChild(row);
  });
  updateSelectUi();
}

async function load({ quiet = false } = {}) {
  const status = $("#status");
  if (!quiet) status.textContent = "Loading…";
  try {
    const data = await api("/api/downloads");
    $("#sub-lbl").textContent = `${data.count} file(s) · ${fmtBytes(data.total_bytes)}`;
    const hadActive = !!lastActiveIds;
    renderActive(data.active || []);
    renderItems(data.items || []);
    if (!quiet) status.textContent = "";
    schedulePoll((data.active || []).length > 0);
    // When downloads finish, refresh file list once
    if (hadActive && !(data.active || []).length) {
      status.textContent = "";
    }
  } catch (e) {
    status.textContent = e.message;
    schedulePoll(false);
  }
}

async function pollActive() {
  try {
    const data = await api("/api/downloads");
    const active = data.active || [];
    const prev = lastActiveIds;
    renderActive(active);
    if (prev && !active.length) {
      renderItems(data.items || []);
      $("#sub-lbl").textContent = `${data.count} file(s) · ${fmtBytes(data.total_bytes)}`;
    } else if (prev !== lastActiveIds && active.length) {
      // new job appeared — keep items as-is
    }
    schedulePoll(active.length > 0);
  } catch (_) {
    schedulePoll(true);
  }
}

function schedulePoll(on) {
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = null;
  }
  if (on) pollTimer = setTimeout(pollActive, 800);
}

$("#chk-select-all").onchange = () => {
  const on = $("#chk-select-all").checked;
  $all("#list .dl-check").forEach((b) => { b.checked = on; });
  updateSelectUi();
};

$("#btn-delete-sel").onclick = async () => {
  const ids = selectedIds();
  if (!ids.length) return;
  const n = ids.length;
  if (!confirm(`Delete ${n} selected download${n === 1 ? "" : "s"}?`)) return;
  const status = $("#status");
  status.textContent = `Deleting ${n}…`;
  let failed = 0;
  for (const id of ids) {
    try {
      await api(`/api/media/${id}`, { method: "DELETE" });
    } catch (_) {
      failed += 1;
    }
  }
  await load({ quiet: true });
  status.textContent = failed
    ? `Deleted ${n - failed}/${n} (${failed} failed)`
    : `Deleted ${n} download${n === 1 ? "" : "s"}`;
};

$("#btn-refresh").onclick = () => load();
load();
</script>
{% endblock %}
