{% extends "base.html" %}
{% block title %}Downloads — AniDex{% endblock %}
{% block content %}
<div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;align-items:flex-end">
  <div>
    <div class="section" style="margin:0">Downloads</div>
    <div class="muted" id="sub-lbl">Local episode files</div>
  </div>
  <div style="flex:1"></div>
  <button class="btn" id="btn-refresh" type="button">Refresh</button>
</div>
<p class="status" id="status">Loading…</p>
<div id="list" class="dl-list"></div>
<p class="muted" id="empty" style="display:none;padding:24px">No downloads yet — grab episodes from Watch on AnimePahe.</p>
{% endblock %}
{% block scripts %}
<script>
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
  return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
}
function fmtEp(ep) {
  if (ep == null || ep === "") return "";
  return Number.isInteger(ep) ? `Ep ${ep}` : `Ep ${ep}`;
}

async function load() {
  const status = $("#status");
  const list = $("#list");
  status.textContent = "Loading…";
  list.innerHTML = "";
  try {
    const data = await api("/api/downloads");
    $("#sub-lbl").textContent = `${data.count} file(s) · ${fmtBytes(data.total_bytes)}`;
    $("#empty").style.display = data.count ? "none" : "block";
    status.textContent = "";
    (data.items || []).forEach((it) => {
      const row = document.createElement("div");
      row.className = "dl-row";
      const ep = fmtEp(it.episode);
      const label = it.label || it.filename || "";
      row.innerHTML = `
        <img class="dl-cover" src="${esc(it.cover_url || "")}" alt="" onerror="this.style.opacity=.2" />
        <div class="dl-main">
          <div class="title">${esc(it.title)}</div>
          <div class="sub">${esc([ep, label, fmtBytes(it.bytes), it.created_at].filter(Boolean).join(" · "))}</div>
        </div>
        <div class="dl-actions row">
          <a class="btn primary" href="${it.user_anime_id ? `/watch/${it.user_anime_id}` : "#"}">Watch</a>
          <a class="btn" href="/api/media/${it.id}/file" target="_blank" rel="noopener">Open file</a>
          <button class="btn danger" type="button" data-del="${it.id}">Delete</button>
        </div>`;
      const del = row.querySelector("[data-del]");
      del.onclick = async () => {
        if (!confirm(`Delete download for ${it.title}${ep ? " · " + ep : ""}?`)) return;
        try {
          await api(`/api/media/${it.id}`, { method: "DELETE" });
          load();
        } catch (e) {
          status.textContent = e.message;
        }
      };
      if (!it.user_anime_id) {
        const w = row.querySelector("a.primary");
        w.removeAttribute("href");
        w.classList.add("disabled");
        w.onclick = (e) => e.preventDefault();
      }
      list.appendChild(row);
    });
  } catch (e) {
    status.textContent = e.message;
  }
}

$("#btn-refresh").onclick = load;
load();
</script>
{% endblock %}
