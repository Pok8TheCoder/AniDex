{% extends "base.html" %}
{% block title %}Upcoming Manga — LocalFun{% endblock %}
{% block content %}
<div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:10px">
  <div>
    <a class="btn ghost" href="/manga">← Manga</a>
    <div class="section" style="margin:8px 0 0">Upcoming Manga</div>
    <div class="muted" id="sub-lbl">Chapter updates from MangaDex</div>
  </div>
  <div style="flex:1"></div>
  <input id="search" placeholder="Search your library…" style="width:min(280px,100%)" />
  <div class="row" id="sort-filters"></div>
</div>
<p class="muted" id="note-lbl" style="margin-top:-4px"></p>
<p class="status" id="status">Checking chapter feeds…</p>
<div class="upcoming-list" id="list"></div>
{% endblock %}
{% block scripts %}
<script>
const SORTS = [
  ["for_you", "For You"],
  ["time", "Newest ch."],
  ["name", "Name"],
];
let currentSort = localStorage.getItem("localfun.manga.upcoming.sort") || "for_you";
let searchTimer = null;

const filters = $("#sort-filters");
SORTS.forEach(([v, l]) => {
  const b = document.createElement("button");
  b.className = "btn chip" + (v === currentSort ? " active" : "");
  b.textContent = l;
  b.onclick = () => {
    currentSort = v;
    localStorage.setItem("localfun.manga.upcoming.sort", v);
    $all(".chip", filters).forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    load();
  };
  filters.appendChild(b);
});

$("#search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(load, 250);
});

function fmtWhen(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString(undefined, {
      weekday: "short", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
  } catch (_) { return iso; }
}

async function load() {
  const status = $("#status");
  const list = $("#list");
  const q = ($("#search").value || "").trim();
  status.textContent = "Loading chapter updates…";
  list.innerHTML = "";
  try {
    const data = await api(
      `/api/manga/upcoming?sort=${encodeURIComponent(currentSort)}&q=${encodeURIComponent(q)}`
    );
    $("#sub-lbl").textContent = `${data.count} title(s) · EN chapters`;
    $("#note-lbl").textContent = data.note || "";
    status.textContent = "";
    if (!data.items.length) {
      status.textContent = q
        ? "No matches."
        : "No chapter updates yet — add MangaDex titles to your list first.";
      return;
    }
    data.items.forEach((it, idx) => {
      const card = document.createElement("article");
      card.className = "upcoming-card" + (it.unread || it.looking_forward >= 55 ? " highlight" : "");
      const reason = it.reason ? `<span class="upc-reason">${it.reason}</span>` : "";
      const chLabel = `Ch. ${it.latest_chapter}` + (it.latest_title ? ` — ${it.latest_title}` : "");
      const readHref = it.latest_chapter_id
        ? `/manga/read/${it.latest_chapter_id}?m=${it.user_manga_id}`
        : `/manga?open=${it.user_manga_id}`;
      card.innerHTML = `
        <div class="upc-rank">${idx + 1}</div>
        <img class="upc-cover" src="${it.cover_url || ""}" alt="" onerror="this.style.opacity=.15" />
        <div class="upc-body">
          <div class="upc-title">${it.display_title}</div>
          <div class="upc-meta muted">${(it.list_status || "").replaceAll("_"," ")} · progress ${it.progress} · ${chLabel}</div>
          <div class="upc-reasons">${reason}</div>
        </div>
        <div class="upc-count">
          <div class="upc-kind muted">Latest chapter</div>
          <div class="upc-timer">${it.countdown.label}</div>
          <div class="upc-when muted">${fmtWhen(it.publish_at)}</div>
        </div>
        <div class="upc-actions">
          <a class="btn primary" href="${readHref}">Read</a>
        </div>`;
      list.appendChild(card);
    });
  } catch (e) {
    status.textContent = e.message;
  }
}

load();
</script>
{% endblock %}
