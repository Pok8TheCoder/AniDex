{% extends "base.html" %}
{% block title %}Read — LocalFun{% endblock %}
{% block shell %}{% endblock %}
{% block content %}
<div class="reader-shell" id="reader-shell">
  <div class="reader-top" id="reader-chrome">
    <a class="btn ghost" id="btn-back" href="/manga">← Back</a>
    <div class="reader-title" id="reader-title">Loading…</div>
    <div class="row reader-controls">
      <label class="muted" style="margin:0">Mode</label>
      <select id="mode" style="width:auto">
        <option value="continuous">Continuous</option>
        <option value="page">1 page</option>
      </select>
      <label class="muted" style="margin:0">Quality</label>
      <select id="quality" style="width:auto">
        <option value="data-saver" selected>Data saver</option>
        <option value="data">Original</option>
      </select>
      <button class="btn" id="btn-fs" type="button" title="Fullscreen">Fullscreen</button>
    </div>
  </div>
  <p class="status" id="reader-status">Loading chapter…</p>

  <div class="reader-stage" id="stage">
    <div class="reader-pages" id="pages"></div>
    <div class="reader-hit left" id="hit-left" aria-hidden="true"></div>
    <div class="reader-hit right" id="hit-right" aria-hidden="true"></div>
  </div>

  <div class="reader-end muted" id="reader-end" style="display:none">End of chapter</div>
</div>
{% endblock %}
{% block scripts %}
<script>
const CHAPTER_ID = {{ chapter_id|tojson }};
const params = new URLSearchParams(location.search);
const backId = params.get("m");
const lang = params.get("lang") || "en";
if (backId) $("#btn-back").href = `/manga?open=${encodeURIComponent(backId)}`;

const MODE_KEY = "localfun.reader.mode";
const CACHE_RADIUS = 5;
const CACHE_PREFIX = "lf-manga-ch-";
const modeSel = $("#mode");
const qualitySel = $("#quality");
modeSel.value = localStorage.getItem(MODE_KEY) === "page" ? "page" : "continuous";

let pageUrls = [];
/** Resolved display URLs (blob: from cache when available) */
let displayUrls = [];
let pageIndex = 0;
let fullscreen = false;
let pushedFsState = false;
let nextChapterId = null;
let prevChapterId = null;
let saveTimer = null;
const pageCache = new Map();
let pageObserver = null;
let chapterCacheName = CACHE_PREFIX + CHAPTER_ID;

function setModeUI() {
  const continuous = modeSel.value === "continuous";
  $("#pages").classList.toggle("paged", !continuous);
  $("#stage").classList.toggle("page-mode", !continuous);
  const end = $("#reader-end");
  if (continuous && pageUrls.length && !fullscreen) {
    end.style.display = "block";
    end.innerHTML = nextChapterId
      ? `End of chapter · <a href="${chapterUrl(nextChapterId)}">Next chapter →</a>`
      : "End of chapter";
  } else {
    end.style.display = "none";
  }
}

function chapterUrl(id) {
  const q = new URLSearchParams();
  if (backId) q.set("m", backId);
  if (lang) q.set("lang", lang);
  const s = q.toString();
  return `/manga/read/${id}${s ? `?${s}` : ""}`;
}

function goChapter(id) {
  if (!id) return;
  clearPageCache();
  savePosition(true);
  location.href = chapterUrl(id);
}

function clearPageCache() {
  pageCache.forEach((img) => { try { img.src = ""; } catch (_) {} });
  pageCache.clear();
  if (pageObserver) { pageObserver.disconnect(); pageObserver = null; }
  displayUrls.forEach((u) => {
    if (u && String(u).startsWith("blob:")) {
      try { URL.revokeObjectURL(u); } catch (_) {}
    }
  });
  displayUrls = [];
}

function cacheWindow(center) {
  if (!pageUrls.length) return { lo: 0, hi: -1 };
  const c = Math.max(0, Math.min(center, pageUrls.length - 1));
  return {
    lo: Math.max(0, c - CACHE_RADIUS),
    hi: Math.min(pageUrls.length - 1, c + CACHE_RADIUS),
  };
}

function pageSrc(i) {
  return displayUrls[i] || pageUrls[i] || "";
}

function warmAround(center) {
  const { lo, hi } = cacheWindow(center);
  for (const [i, img] of [...pageCache.entries()]) {
    if (i < lo || i > hi) {
      try { img.src = ""; } catch (_) {}
      pageCache.delete(i);
    }
  }
  for (let i = lo; i <= hi; i++) {
    const src = pageSrc(i);
    if (!src) continue;
    let img = pageCache.get(i);
    if (!img) {
      img = new Image();
      img.decoding = "async";
      pageCache.set(i, img);
    }
    if (img.dataset.src !== src) {
      img.dataset.src = src;
      img.src = src;
    }
  }
  syncContinuousDom(lo, hi);
}

function bindPageImg(img, index, src) {
  img.dataset.index = String(index);
  img.dataset.src = src;
  img.alt = `Page ${index + 1}`;
  img.decoding = "async";
  img.classList.add("is-placeholder");
  img.onload = () => {
    img.classList.remove("is-placeholder");
    if (img.naturalHeight) {
      img.style.minHeight = "";
      img.dataset.loadedH = String(img.naturalHeight);
    }
  };
}

function unloadDomImg(img) {
  if (img.dataset.loadedH) img.style.minHeight = `${img.dataset.loadedH}px`;
  img.classList.add("is-placeholder");
  img.removeAttribute("src");
}

function loadDomImg(img, src) {
  if (img.getAttribute("src") === src) return;
  img.src = src;
}

function syncContinuousDom(lo, hi) {
  if (modeSel.value !== "continuous") return;
  $all("img.reader-page", $("#pages")).forEach((img) => {
    const i = Number(img.dataset.index);
    const src = pageSrc(i);
    if (i >= lo && i <= hi && src) loadDomImg(img, src);
    else if (img.hasAttribute("src")) unloadDomImg(img);
  });
}

function observeContinuousPages() {
  if (pageObserver) pageObserver.disconnect();
  const imgs = $all("img.reader-page", $("#pages"));
  if (!imgs.length || !("IntersectionObserver" in window)) {
    warmAround(0);
    return;
  }
  let bestIdx = pageIndex || 0;
  pageObserver = new IntersectionObserver(
    (entries) => {
      let topRatio = 0;
      let topIdx = bestIdx;
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const i = Number(e.target.dataset.index);
        if (e.intersectionRatio >= topRatio) {
          topRatio = e.intersectionRatio;
          topIdx = i;
        }
      }
      if (topRatio > 0 && topIdx !== bestIdx) {
        bestIdx = topIdx;
        pageIndex = bestIdx;
        warmAround(bestIdx);
        scheduleSavePosition();
      }
    },
    { root: null, rootMargin: "200% 0px", threshold: [0, 0.15, 0.35, 0.55, 0.75] }
  );
  imgs.forEach((img) => pageObserver.observe(img));
  warmAround(pageIndex || 0);
}

function renderContinuous() {
  const host = $("#pages");
  host.innerHTML = "";
  pageUrls.forEach((_, i) => {
    const img = document.createElement("img");
    img.className = "reader-page";
    bindPageImg(img, i, pageSrc(i));
    host.appendChild(img);
  });
  observeContinuousPages();
  // Scroll to resumed page
  requestAnimationFrame(() => {
    const el = host.querySelector(`img[data-index="${pageIndex}"]`);
    if (el && pageIndex > 0) el.scrollIntoView({ block: "start" });
  });
}

function renderPage() {
  const host = $("#pages");
  host.innerHTML = "";
  if (!pageUrls.length) return;
  pageIndex = Math.max(0, Math.min(pageIndex, pageUrls.length - 1));
  warmAround(pageIndex);
  const img = document.createElement("img");
  img.className = "reader-page reader-page-single";
  const src = pageSrc(pageIndex);
  bindPageImg(img, pageIndex, src);
  img.src = src;
  img.classList.toggle("is-placeholder", !img.complete);
  host.appendChild(img);
  if (!fullscreen) {
    let t = `${pageIndex + 1} / ${pageUrls.length}`;
    if (pageIndex >= pageUrls.length - 1 && nextChapterId) t += " · next →";
    $("#reader-status").textContent = t;
  }
  window.scrollTo({ top: 0, behavior: "auto" });
  scheduleSavePosition();
}

function applyRender() {
  setModeUI();
  if (modeSel.value === "page") renderPage();
  else {
    renderContinuous();
    if (pageUrls.length) $("#reader-status").textContent = `${pageUrls.length} pages`;
  }
}

function scheduleSavePosition() {
  if (!backId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => savePosition(false), 400);
}

async function savePosition(sync) {
  if (!backId) return;
  const body = JSON.stringify({ page_index: pageIndex });
  const url = `/api/manga/${backId}/chapters/${CHAPTER_ID}/position`;
  try {
    if (sync && navigator.sendBeacon) {
      const blob = new Blob([body], { type: "application/json" });
      // sendBeacon can't PUT easily — fall through to fetch keepalive
    }
    await fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body,
      credentials: "same-origin",
      keepalive: true,
    });
  } catch (_) {}
}

function prevPage() {
  if (modeSel.value !== "page") return;
  if (pageIndex > 0) {
    pageIndex -= 1;
    renderPage();
  } else if (prevChapterId) {
    goChapter(prevChapterId);
  }
}
function nextPage() {
  if (modeSel.value !== "page") return;
  if (pageIndex < pageUrls.length - 1) {
    pageIndex += 1;
    renderPage();
  } else if (nextChapterId) {
    goChapter(nextChapterId);
  }
}

function enterFullscreen() {
  if (fullscreen) return;
  fullscreen = true;
  document.body.classList.add("reader-fs");
  $("#btn-fs").textContent = "Exit FS";
  setModeUI();
  if (modeSel.value === "page") renderPage();
  history.pushState({ localfunFs: true }, "");
  pushedFsState = true;
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

function exitFullscreen({ fromPopstate = false } = {}) {
  if (!fullscreen) return;
  fullscreen = false;
  document.body.classList.remove("reader-fs");
  $("#btn-fs").textContent = "Fullscreen";
  setModeUI();
  if (modeSel.value === "page") renderPage();
  else if (pageUrls.length) $("#reader-status").textContent = `${pageUrls.length} pages`;
  const needBack = pushedFsState && !fromPopstate;
  pushedFsState = false;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (needBack) history.back();
}

async function loadAdjacent() {
  if (!backId) return;
  try {
    const data = await api(
      `/api/manga/${backId}/chapters/${CHAPTER_ID}/adjacent?lang=${encodeURIComponent(lang)}`
    );
    nextChapterId = data.next || null;
    prevChapterId = data.prev || null;
    setModeUI();
    if (modeSel.value === "page" && pageUrls.length) renderPage();
  } catch (_) {
    nextChapterId = null;
    prevChapterId = null;
  }
}

async function pruneOtherChapterCaches() {
  if (!("caches" in window)) return;
  try {
    const keys = await caches.keys();
    await Promise.all(
      keys
        .filter((k) => k.startsWith(CACHE_PREFIX) && k !== chapterCacheName)
        .map((k) => caches.delete(k))
    );
  } catch (_) {}
}

async function cacheEntireChapter(urls) {
  if (!("caches" in window) || !urls.length) return;
  await pruneOtherChapterCaches();
  const cache = await caches.open(chapterCacheName);
  let done = 0;
  const status = $("#reader-status");
  for (const url of urls) {
    try {
      const hit = await cache.match(url);
      if (!hit) {
        const res = await fetch(url, { credentials: "same-origin" });
        if (res.ok) await cache.put(url, res.clone());
      }
    } catch (_) {}
    done += 1;
    if (!fullscreen && modeSel.value === "continuous") {
      status.textContent = `Caching chapter ${done}/${urls.length}…`;
    }
  }
  // Build blob URLs for offline-friendly display
  displayUrls = [];
  for (let i = 0; i < urls.length; i++) {
    try {
      const res = await cache.match(urls[i]);
      if (res) {
        displayUrls[i] = URL.createObjectURL(await res.blob());
      } else {
        displayUrls[i] = urls[i];
      }
    } catch (_) {
      displayUrls[i] = urls[i];
    }
  }
  // Refresh visible images with cached blobs
  warmAround(pageIndex);
  if (modeSel.value === "page") renderPage();
  else if (!fullscreen) status.textContent = `${urls.length} pages · cached for offline`;
}

async function load() {
  const quality = qualitySel.value;
  const status = $("#reader-status");
  status.textContent = "Loading pages…";
  clearPageCache();
  pageUrls = [];
  pageIndex = 0;
  $("#pages").innerHTML = "";
  try {
    const offlineQ = backId ? `&user_manga_id=${encodeURIComponent(backId)}` : "";
    const data = await api(`/api/manga/chapter/${CHAPTER_ID}/read?quality=${encodeURIComponent(quality)}${offlineQ}`);
    const label = [data.manga_title, `Ch.${data.chapter}`, data.title].filter(Boolean).join(" — ");
    $("#reader-title").textContent = label;
    document.title = label + " — LocalFun";
    pageUrls = data.pages || [];
    displayUrls = pageUrls.slice();

    if (backId) {
      try {
        const pos = await api(`/api/manga/${backId}/chapters/${CHAPTER_ID}/position`);
        if (pos.saved && pos.page_index != null) {
          pageIndex = Math.max(0, Math.min(Number(pos.page_index) || 0, pageUrls.length - 1));
        }
      } catch (_) {}
    }

    status.textContent = `${pageUrls.length} pages` + (pageIndex ? ` · resume p.${pageIndex + 1}` : "");
    applyRender();

    if (backId && data.chapter && !Number.isNaN(parseFloat(data.chapter))) {
      const ch = Math.floor(parseFloat(data.chapter));
      api(`/api/manga/${backId}`, {
        method: "PATCH",
        body: JSON.stringify({ progress: ch, list_status: "reading" }),
      }).catch(() => {});
    }
    loadAdjacent();
    // Full-chapter cache (does not replace permanent offline downloads)
    cacheEntireChapter(pageUrls).catch(() => {});
  } catch (e) {
    status.textContent = e.message;
  }
}

modeSel.onchange = () => {
  localStorage.setItem(MODE_KEY, modeSel.value);
  clearPageCache();
  displayUrls = displayUrls.length ? displayUrls : pageUrls.slice();
  applyRender();
};
qualitySel.onchange = load;
$("#btn-fs").onclick = () => (fullscreen ? exitFullscreen() : enterFullscreen());
$("#hit-left").onclick = (ev) => { ev.preventDefault(); prevPage(); };
$("#hit-right").onclick = (ev) => { ev.preventDefault(); nextPage(); };

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && fullscreen) {
    ev.preventDefault();
    exitFullscreen();
    return;
  }
  if (modeSel.value !== "page") return;
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") {
    ev.preventDefault();
    prevPage();
  } else if (ev.key === "ArrowRight" || ev.key === "PageDown" || ev.key === " ") {
    ev.preventDefault();
    nextPage();
  }
});

window.addEventListener("popstate", () => {
  if (fullscreen) exitFullscreen({ fromPopstate: true });
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && fullscreen) exitFullscreen({ fromPopstate: true });
});
window.addEventListener("pagehide", () => {
  savePosition(true);
  clearPageCache();
});

load();
</script>
{% endblock %}
